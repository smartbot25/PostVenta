<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Aplicación local para registrar incidencias de postventa">
    <meta name="author" content="Edgar Pinedo">

    <title>PostVenta</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <!-- =========================
         APLICACIÓN
    ========================== -->

    <div id="screen-app" class="screen active">

        <header>
            <div class="container">

                <div class="header-left">
                    <h1>PostVenta</h1>
                    <p>Registro de incidencias</p>
                </div>

                <div class="header-right">
                    <span id="user-badge" class="user-badge">📱 Local</span>
                </div>

            </div>
        </header>


        <!-- =========================
             TABS
        ========================== -->

        <div class="container">

            <div class="tabs">
                <button class="tab active" data-tab="nueva">
                    Nueva incidencia
                </button>

                <button class="tab" data-tab="historial">
                    Historial
                </button>
            </div>


            <!-- =========================
                 NUEVA INCIDENCIA
            ========================== -->

            <section id="tab-nueva" class="tab-content active">

                <form id="form-inc">

                    <div class="form-group">
                        <label for="inp-depto">Departamento</label>

                        <input
                            type="text"
                            id="inp-depto"
                            placeholder="Ej. 308"
                            autocomplete="off"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="inp-cat">Categoría</label>

                        <select id="inp-cat" required>

                            <option value="">
                                Seleccionar categoría
                            </option>

                            <option value="Fisuras">
                                Fisuras
                            </option>

                            <option value="Humedad">
                                Humedad
                            </option>

                            <option value="Filtración">
                                Filtración
                            </option>

                            <option value="Acabados">
                                Acabados
                            </option>

                            <option value="Pintura">
                                Pintura
                            </option>

                            <option value="Puertas">
                                Puertas
                            </option>

                            <option value="Ventanas">
                                Ventanas
                            </option>

                            <option value="Instalaciones eléctricas">
                                Instalaciones eléctricas
                            </option>

                            <option value="Instalaciones sanitarias">
                                Instalaciones sanitarias
                            </option>

                            <option value="Otros">
                                Otros
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="inp-desc">Descripción</label>

                        <textarea
                            id="inp-desc"
                            rows="5"
                            placeholder="Describe la incidencia..."
                            required
                        ></textarea>
                    </div>


                    <!-- =========================
                         FOTOS
                    ========================== -->

                    <div class="form-group">

                        <label>Fotos</label>

                        <div id="foto-area" class="foto-area">

                            <div id="foto-preview" class="foto-preview"></div>

                            <div id="foto-ph" class="foto-placeholder">
                                <span>📷</span>
                                <p>Selecciona una o varias fotos</p>
                            </div>

                        </div>


                        <div class="foto-buttons">

                            <!-- CÁMARA -->
                            <button
                                type="button"
                                id="btn-camara"
                                class="btn-secondary"
                            >
                                📷 Cámara
                            </button>


                            <!-- GALERÍA -->
                            <button
                                type="button"
                                id="btn-galeria"
                                class="btn-secondary"
                            >
                                🖼️ Galería
                            </button>

                        </div>


                        <!--
                            IMPORTANTE:
                            multiple permite seleccionar
                            varias fotos de una sola vez.
                        -->

                        <input
                            type="file"
                            id="foto-input"
                            accept="image/*"
                            multiple
                            hidden
                        >

                    </div>


                    <button
                        type="submit"
                        id="btn-submit"
                        class="btn-primary"
                    >
                        <span id="submit-text">
                            Registrar incidencia
                        </span>

                        <span id="submit-loader" hidden>
                            Guardando...
                        </span>
                    </button>

                </form>

            </section>


            <!-- =========================
                 HISTORIAL
            ========================== -->

            <section
                id="tab-historial"
                class="tab-content"
            >

                <div class="history-toolbar">

                    <input
                        type="search"
                        id="buscador"
                        placeholder="Buscar incidencia..."
                    >

                    <button
                        type="button"
                        id="btn-reporte"
                        class="btn-primary"
                    >
                        📄 Reporte
                    </button>

                </div>


                <div id="lista-cards"></div>

            </section>

        </div>

    </div>


    <!-- =========================
         MODAL ÉXITO
    ========================== -->

    <div id="modal-ok" class="modal">

        <div class="modal-content">

            <h2>¡Guardado!</h2>

            <p id="modal-ok-msg">
                La incidencia fue registrada correctamente.
            </p>

            <button
                type="button"
                id="btn-modal-ok"
                class="btn-primary"
            >
                Aceptar
            </button>

        </div>

    </div>


    <!-- =========================
         MODAL REPORTE
    ========================== -->

    <div id="modal-reporte" class="modal">

        <div class="modal-content">

            <h2>Generar reporte</h2>

            <div class="form-group">

                <label for="fecha-desde">
                    Desde
                </label>

                <input
                    type="date"
                    id="fecha-desde"
                >

            </div>


            <div class="form-group">

                <label for="fecha-hasta">
                    Hasta
                </label>

                <input
                    type="date"
                    id="fecha-hasta"
                >

            </div>


            <div class="modal-buttons">

                <button
                    type="button"
                    id="btn-cancel-rep"
                    class="btn-secondary"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btn-enviar-wa"
                    class="btn-primary"
                >
                    📄 Generar PDF
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         MODAL CONFIRMACIÓN
    ========================== -->

    <div id="modal-conf" class="modal">

        <div class="modal-content">

            <h2 id="conf-titulo">
                Confirmar
            </h2>

            <p id="conf-msg">
                ¿Deseas continuar?
            </p>

            <div class="modal-buttons">

                <button
                    type="button"
                    id="btn-conf-cancel"
                    class="btn-secondary"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btn-conf-ok"
                    class="btn-primary"
                >
                    Confirmar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div id="toast"></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js?v=3"></script>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("sw.js")
                    .catch(error => {
                        console.error(
                            "Error registrando Service Worker:",
                            error
                        );
                    });

            });

        }

    </script>

</body>
</html>
