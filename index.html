<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Postventa"/>
  <title>Postventa</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- ══ AUTH ══════════════════════════════════════════ -->
<div id="screen-auth" class="screen active">
  <div class="auth-brand">
    <div class="brand-icon">🏗️</div>
    <h1>Postventa</h1>
    <p class="brand-sub">Control de Incidencias en Obra</p>
  </div>
  <form class="auth-form" id="form-auth" autocomplete="on" novalidate>
    <div class="field-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tecnico@empresa.com" autocomplete="email"/>
    </div>
    <div class="field-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn-primary" id="btn-login">
      <span id="login-text">Ingresar</span>
      <span id="login-loader" class="loader hidden"></span>
    </button>
    <p id="auth-error" class="error-msg hidden"></p>
  </form>
</div>

<!-- ══ APP ═══════════════════════════════════════════ -->
<div id="screen-app" class="screen">

  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">🏗️</span>
      <span class="header-title">Postventa</span>
    </div>
    <div class="header-right">
      <span id="user-badge" class="user-badge"></span>
      <button class="btn-icon" id="btn-logout" title="Cerrar sesión">X</button>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" data-tab="nueva">＋ Nueva</button>
    <button class="tab" data-tab="lista">📋 Historial</button>
  </nav>

  <!-- TAB: NUEVA INCIDENCIA -->
  <div id="tab-nueva" class="tab-content active">
    <form id="form-incidencia" novalidate>

      <div class="field-group">
        <label for="departamento">Nro de Departamento *</label>
        <input type="text" id="departamento" placeholder="Ej: 401-B, Torre C Piso 3" required/>
      </div>

      <div class="field-group">
        <label for="categoria">Categoría *</label>
        <select id="categoria" required>
          <option value="">— Seleccionar —</option>
          <option value="Acabados">Acabados</option>
          <option value="Carpintería">Carpintería</option>
          <option value="Cerámica / Pisos">Cerámica / Pisos</option>
          <option value="Electricidad">Electricidad</option>
          <option value="Filtraciones / Humedad">Filtraciones / Humedad</option>
          <option value="Pintura">Pintura</option>
          <option value="Sanitarios / Gasfitería">Sanitarios / Gasfitería</option>
          <option value="Ventanas / Puertas">Ventanas / Puertas</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="field-group">
        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion" rows="4" placeholder="Describe el problema con detalle…" required></textarea>
      </div>

      <div class="field-group">
        <label>Foto de evidencia</label>
        <input type="file" id="foto-input" accept="image/*" class="hidden"/>
        <input type="file" id="foto-sol-input" accept="image/*" capture="environment" class="hidden"/>
        <div id="foto-area" class="foto-area">
          <div id="foto-placeholder" class="foto-placeholder">
            <span class="foto-icon">📷</span>
            <span>Toca para capturar foto</span>
          </div>
          <img id="foto-preview" class="hidden" alt="Vista previa"/>
        </div>
        <div class="foto-actions">
          <button type="button" class="btn-sec" id="btn-camara">📷 Cámara</button>
          <button type="button" class="btn-sec" id="btn-galeria">🖼️ Galería</button>
          <button type="button" class="btn-quitar hidden" id="btn-quitar-foto">✕ Quitar</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-submit" id="btn-submit">
        <span id="submit-text">Registrar Incidencia</span>
        <span id="submit-loader" class="loader hidden"></span>
      </button>

    </form>

    <!-- Modal éxito -->
    <div id="modal-ok" class="modal hidden">
      <div class="modal-box modal-ok-box">
        <div class="modal-icon">✅</div>
        <h2>¡Registrada!</h2>
        <p id="modal-ok-msg"></p>
        <button class="btn-primary" id="btn-modal-ok">Nueva incidencia</button>
      </div>
    </div>
  </div>

  <!-- TAB: HISTORIAL -->
  <div id="tab-lista" class="tab-content">
    <div class="lista-toolbar">
      <input type="search" id="buscador" placeholder="🔍 Buscar por depto, categoría…" class="buscador"/>
      <button class="btn-reporte" id="btn-reporte">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        Enviar Reporte
      </button>
    </div>
    <div id="lista-cards" class="lista-cards">
      <div class="empty-state"><span>📋</span><p>Cargando historial…</p></div>
    </div>
  </div>

</div><!-- /screen-app -->

<!-- ══ MODAL REPORTE PDF ══════════════════════════════ -->
<div id="modal-reporte" class="modal hidden">
  <div class="modal-box">
    <div class="modal-icon">📄</div>
    <h2>Enviar Reporte</h2>
    <p>Selecciona el rango de fechas</p>
    <div class="rango-fechas">
      <div class="field-group">
        <label for="fecha-desde">Desde</label>
        <input type="date" id="fecha-desde"/>
      </div>
      <div class="field-group">
        <label for="fecha-hasta">Hasta</label>
        <input type="date" id="fecha-hasta"/>
      </div>
    </div>
    <div class="reporte-btns">
      <button class="btn-sec" id="btn-cancelar-reporte">Cancelar</button>
      <button class="btn-wa" id="btn-enviar-wa">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.136.561 4.14 1.535 5.873L.057 23.571a.75.75 0 0 0 .921.921l5.698-1.478A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.956 9.956 0 0 1-5.187-1.452l-.37-.221-3.384.878.893-3.26-.242-.385A9.953 9.953 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
        </svg>
        Generar PDF y WhatsApp
        <span id="wa-loader" class="loader loader-white hidden"></span>
      </button>
    </div>
  </div>
</div>

<!-- ══ MODAL CONFIRMAR BORRAR ═════════════════════════ -->
<div id="modal-confirmar" class="modal hidden">
  <div class="modal-box modal-danger-box">
    <div class="modal-icon">⚠️</div>
    <h3 id="confirm-titulo"></h3>
    <p id="confirm-msg"></p>
    <div class="reporte-btns">
      <button class="btn-sec" id="btn-conf-cancel">Cancelar</button>
      <button class="btn-danger" id="btn-conf-ok"></button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
